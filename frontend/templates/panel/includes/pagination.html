{% if page.has_other_pages %}<div class="panel-pagination" aria-label="Paginación">{% if page.has_previous %}<a class="panel-button secondary" href="?{{ query }}&amp;page={{ page.previous_page_number }}">← Anterior</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="panel-button secondary" href="?{{ query }}&amp;page={{ page.next_page_number }}">Siguiente →</a>{% endif %}</div>{% endif %}
